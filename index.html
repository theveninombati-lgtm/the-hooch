<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hooch | Jewelry & Dresses</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink:#ff6fae;
      --lavender:#c9b6ff;
      --light:#fff0f6;
      --dark:#2b2b2b;
    }

    body {
      margin:0;
      font-family:Poppins, sans-serif;
      background:var(--light);
      color:var(--dark);
    }

    header {
      background:linear-gradient(135deg,var(--pink),var(--lavender));
      padding:1.5rem 2rem;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
    }

    header h1 {
      font-family:'Playfair Display',serif;
    }

    nav a {
      color:white;
      margin-left:1.2rem;
      text-decoration:none;
      font-weight:500;
    }

    .hero {
      background:url("https://images.unsplash.com/photo-1520975698519-59c4f4c2f81d") center/cover;
      padding:5rem 2rem;
      text-align:center;
      color:white;
    }

    .hero h2 {
      font-size:3rem;
      font-family:'Playfair Display',serif;
    }

    .hero button {
      background:var(--pink);
      border:none;
      padding:1rem 2.5rem;
      border-radius:30px;
      color:white;
      font-size:1rem;
      cursor:pointer;
      margin-top:1.5rem;
    }

    section {
      max-width:1200px;
      margin:auto;
      padding:3rem 2rem;
    }

    h3 {
      text-align:center;
      font-size:2.2rem;
      font-family:'Playfair Display',serif;
      margin-bottom:2rem;
    }

    .products {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:2rem;
    }

    .card {
      background:white;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
      overflow:hidden;
      transition:.3s;
    }

    .card:hover { transform:translateY(-6px); }

    .card img {
      width:100%;
      height:280px;
      object-fit:cover;
    }

    .info {
      padding:1.2rem;
      text-align:center;
    }

    .info button {
      background:var(--lavender);
      border:none;
      padding:.6rem 1.5rem;
      border-radius:20px;
      color:white;
      cursor:pointer;
    }

    .cart {
      position:fixed;
      bottom:20px;
      right:20px;
      background:white;
      width:280px;
      padding:1rem;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }

    footer {
      background:#2b2b2b;
      color:white;
      text-align:center;
      padding:2rem;
    }
  </style>
</head>
<body>

<header>
  <h1>The Hooch</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#dresses">Dresses</a>
    <a href="#jewelry">Jewelry</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<section class="hero" id="home">
  <h2>Where Fashion Meets Sparkle ✨</h2>
  <p>Trendy dresses & dreamy jewelry for bold girls</p>
  <button onclick="scrollToShop()">Shop Now</button>
</section>

<section id="dresses">
  <h3>Dresses</h3>
  <div class="products">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <div class="info">
        <h4>Pink Summer Dress</h4>
        <p>KES 3500</p>
        <button onclick="addToCart('Pink Summer Dress',3500)">Add to Cart</button>
      </div>
    </div>
  </div>
</section>

<section id="jewelry">
  <h3>Jewelry</h3>
  <div class="products">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
      <div class="info">
        <h4>Heart Necklace</h4>
        <p>KES 1500</p>
        <button onclick="addToCart('Heart Necklace',1500)">Add to Cart</button>
      </div>
    </div>
  </div>
</section>

<div class="cart">
  <h4>🛒 Cart</h4>
  <ul id="items"></ul>
  <strong>Total: KES <span id="total">0</span></strong>
  <button onclick="payMpesa()" style="width:100%;margin-top:10px">Pay with M-Pesa</button>
</div>

<footer>
  <p>© 2026 The Hooch 💖</p>
</footer>

<script>
let total = 0;

function addToCart(name, price){
  const li = document.createElement('li');
  li.textContent = `${name} - KES ${price}`;
  items.appendChild(li);
  total += price;
  document.getElementById('total').innerText = total;
}

function scrollToShop(){
  document.getElementById('dresses').scrollIntoView({behavior:'smooth'});
}

function payMpesa(){
  const phone = prompt("Enter phone number (2547XXXXXXXX)");
  fetch("https://YOUR-BACKEND-URL/mpesa/pay",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ phone, amount: total })
  }).then(()=>alert("Check your phone 📲"));
}
</script>

</body>
</html>
